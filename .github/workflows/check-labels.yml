name: Check PR Labels
on:
  pull_request:
    types: [opened, labeled, unlabeled, synchronize]

jobs:
  check-labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: yarn
      - uses: ./
        with:
          one-of: |
            major, minor, patch
            release, skip-release
          none-of: DO NOT MERGE
